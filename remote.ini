; ======================================================================
;  CouchTV remote buttons:   <button code> = <action>
;
;  The easy way to fill this in: on the TV home screen open
;  Settings & power > Remote, and press each button when asked. Any infrared
;  remote works, and you can set up as many remotes as you like.
;
;  You can also edit it by hand. The receiver reports each button's code (the
;  Remote setup screen shows it as you press). Save, then press F5 on the
;  home screen to reload.
;
;  Actions
;    up  down  left  right  ok  back  home  menu  escape  space  backspace
;    tab  pageup  pagedown  playpause  volup  voldown  mute  power  sleeptimer
;    open:<tile name>     open a tile from anywhere, e.g. open:Netflix
;    key:<key>            type a key, e.g. key:F (full screen), key:Shift+N,
;                         key:MediaNextTrack
;    mouse:up  mouse:down  mouse:left  mouse:right  (hold to move the pointer)
;    mouse:click  mouse:rightclick  mouse:scrollup  mouse:scrolldown
;
;  Holding a "back" button goes Home. "power" buttons also wake the PC from
;  sleep: CouchTV stores them on the receiver.
; ======================================================================

[Buttons]
; ----- CouchTV phone remote (NEC, address CE) - see ir-receiver/PROTOCOL.md -----
NEC 00CE 0001 = up
NEC 00CE 0002 = down
NEC 00CE 0003 = left
NEC 00CE 0004 = right
NEC 00CE 0005 = ok
NEC 00CE 0006 = back
NEC 00CE 0007 = home
NEC 00CE 0008 = menu
NEC 00CE 0009 = escape
NEC 00CE 000A = playpause
NEC 00CE 000B = backspace
NEC 00CE 0010 = volup
NEC 00CE 0011 = voldown
NEC 00CE 0012 = mute
NEC 00CE 0020 = power
NEC 00CE 0021 = sleeptimer
NEC 00CE 0030 = mouse:up
NEC 00CE 0031 = mouse:down
NEC 00CE 0032 = mouse:left
NEC 00CE 0033 = mouse:right
NEC 00CE 0034 = mouse:click
NEC 00CE 0035 = mouse:rightclick
NEC 00CE 0036 = mouse:scrollup
NEC 00CE 0037 = mouse:scrolldown
NEC 00CE 0040 = open:Netflix
NEC 00CE 0041 = open:YouTube
NEC 00CE 0042 = open:Prime Video
NEC 00CE 0043 = open:JioHotstar
NEC 00CE 0044 = open:Web
NEC 00CE 0050 = key:F
