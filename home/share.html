<!doctype html>
<!--
  The phones' screens on the TV (PhoneShare.cs, ShareWindow.cs): up to 3 side by side, each with its name, their
  sounds mixed. PhoneShare passes each phone's messages over a WebSocket as they come: H.264 pictures, decoded here by
  Edge's own decoder (WebCodecs, on the graphics chip), and plain 16-bit stereo sound, played through a small buffer
  (40 ms, never more than 150) in an AudioWorklet that mixes them. Binary messages: the phone's slot, then 1 (the
  picture's size), 2 (flags, 1 = whole; time in µs, 64-bit; H.264, Annex B) or 3 (10 ms of sound). Text: the phones.
  This says "ready", "key <slot>" when a decoder needs a whole picture to start from, and "stats <json>" each second.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
  #phones { display: flex; width: 100%; height: 100%; gap: 14px; box-sizing: border-box; }
  .phone { flex: 1 1 0; position: relative; min-width: 0; display: flex; align-items: center; justify-content: center; }
  .phone canvas { width: 100%; height: 100%; object-fit: contain; }
  .name { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); white-space: nowrap; max-width: 90%;
          overflow: hidden; text-overflow: ellipsis; color: #F4F6FA; background: rgba(11, 14, 20, 0.6); padding: 7px 18px;
          border-radius: 20px; font-size: 22px; transition: opacity 0.6s ease; }
  .name.quiet { opacity: 0; }
  .wait { position: absolute; color: #A3ACBC; font-size: 26px; }
</style>
</head>
<body>
<div id="phones"></div>
<script>
  'use strict';
  const box = document.getElementById('phones');
  const slots = new Map();   // slot -> { el, canvas, ctx, label, wait, decoder, codec, needWhole, shown, decoded }
  let ws = null, audio = null, mixer = null, audioStarting = false;

  // ---------------------------------------------------------------- the connection

  function connect() {
    ws = new WebSocket('ws://' + location.host + '/ws' + location.search);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => ws.send('ready');
    ws.onmessage = e => {
      if (typeof e.data === 'string') { const m = JSON.parse(e.data); if (m.phones) layout(m.phones); }
      else media(new Uint8Array(e.data));
    };
    ws.onclose = () => setTimeout(connect, 500);
  }

  function say(text) { if (ws && ws.readyState === 1) ws.send(text); }

  // ---------------------------------------------------------------- the phones, side by side

  function layout(phones) {
    const wanted = new Set(phones.map(p => p.slot));
    for (const slot of [...slots.keys()]) if (!wanted.has(slot)) remove(slot);
    for (const p of phones) {
      let s = slots.get(p.slot);
      if (!s) s = add(p.slot);
      if (s.label.textContent !== p.name) {
        s.label.textContent = p.name;
        showName(s);
      }
    }
    for (const slot of [...slots.keys()].sort()) box.appendChild(slots.get(slot).el);   // in slot order, left to right
  }

  function add(slot) {
    const el = document.createElement('div');
    el.className = 'phone';
    const canvas = document.createElement('canvas');
    canvas.width = 2; canvas.height = 2;
    const wait = document.createElement('div');
    wait.className = 'wait';
    wait.textContent = 'Connecting…';
    const label = document.createElement('div');
    label.className = 'name';
    el.append(canvas, wait, label);
    box.appendChild(el);
    const s = { slot, el, canvas, ctx: canvas.getContext('2d'), label, wait, decoder: null, codec: null, needWhole: true,
                decoded: 0, nameTimer: 0 };
    slots.set(slot, s);
    return s;
  }

  // The name shows for a few seconds when a phone comes (and when another does), then gets out of the way.
  function showName(s) {
    s.label.classList.remove('quiet');
    clearTimeout(s.nameTimer);
    s.nameTimer = setTimeout(() => s.label.classList.add('quiet'), 5000);
  }

  function remove(slot) {
    const s = slots.get(slot);
    if (s.decoder && s.decoder.state !== 'closed') s.decoder.close();
    s.el.remove();
    slots.delete(slot);
    if (mixer) mixer.port.postMessage({ slot, gone: true });
    for (const other of slots.values()) showName(other);
  }

  function media(b) {
    const s = slots.get(b[0]);
    if (!s) return;
    if (b[1] === 1) s.needWhole = true;   // a new size (the phone turned): its next whole picture starts afresh
    else if (b[1] === 2) picture(s, b);
    else if (b[1] === 3) sound(b[0], b);
  }

  // ---------------------------------------------------------------- pictures

  function picture(s, b) {
    const whole = (b[2] & 1) === 1;
    const data = b.subarray(11);
    if (s.needWhole && !whole) return;
    if (whole) {
      const codec = codecOf(data);
      if (codec && (codec !== s.codec || !s.decoder || s.decoder.state !== 'configured')) configure(s, codec);
    }
    if (!s.decoder || s.decoder.state !== 'configured') return;
    if (!whole && s.decoder.decodeQueueSize > 3) {
      // Behind (a slow moment): skip to the next whole picture rather than show the past.
      s.needWhole = true;
      say('key ' + s.slot);
      return;
    }
    const view = new DataView(b.buffer, b.byteOffset);
    const time = view.getUint32(3) * 4294967296 + view.getUint32(7);
    try {
      s.decoder.decode(new EncodedVideoChunk({ type: whole ? 'key' : 'delta', timestamp: time, data }));
      s.needWhole = false;
    } catch (e) {
      s.needWhole = true;
      say('key ' + s.slot);
    }
  }

  function configure(s, codec) {
    if (s.decoder && s.decoder.state !== 'closed') s.decoder.close();
    s.decoder = new VideoDecoder({
      output: frame => draw(s, frame),
      error: () => { s.codec = null; s.needWhole = true; say('key ' + s.slot); },
    });
    try {
      s.decoder.configure({ codec, optimizeForLatency: true });
      s.codec = codec;
    } catch (e) {
      s.decoder.configure({ codec: 'avc1.42E01F', optimizeForLatency: true });   // the plainest H.264
      s.codec = codec;
    }
  }

  function draw(s, frame) {
    if (s.canvas.width !== frame.displayWidth || s.canvas.height !== frame.displayHeight) {
      s.canvas.width = frame.displayWidth;
      s.canvas.height = frame.displayHeight;
    }
    s.ctx.drawImage(frame, 0, 0);
    frame.close();
    s.decoded++;
    if (s.wait.parentNode) s.wait.remove();
  }

  // "avc1.PPCCLL" from the picture's sequence parameters (profile, constraints, level), as WebCodecs wants it.
  function codecOf(data) {
    for (let i = 0; i + 4 < data.length; i++) {
      if (data[i] !== 0 || data[i + 1] !== 0) continue;
      let at = -1;
      if (data[i + 2] === 1) at = i + 3;
      else if (data[i + 2] === 0 && data[i + 3] === 1) at = i + 4;
      if (at < 0 || at + 3 >= data.length) continue;
      if ((data[at] & 0x1F) === 7) {
        const hex = n => n.toString(16).padStart(2, '0').toUpperCase();
        return 'avc1.' + hex(data[at + 1]) + hex(data[at + 2]) + hex(data[at + 3]);
      }
    }
    return null;
  }

  // ---------------------------------------------------------------- sound: every phone's, mixed

  const MIXER = `
    class Mix extends AudioWorkletProcessor {
      constructor() {
        super();
        this.phones = new Map();
        this.port.onmessage = e => {
          const m = e.data;
          if (m.gone) { this.phones.delete(m.slot); return; }
          let p = this.phones.get(m.slot);
          if (!p) { p = { chunks: [], at: 0, size: 0, playing: false }; this.phones.set(m.slot, p); }
          p.chunks.push(m.pcm);
          p.size += m.pcm.length;
          // Never more than 150 ms behind: the oldest goes (48 kHz, two channels).
          while (p.size > 14400 && p.chunks.length > 1) { const old = p.chunks.shift(); p.size -= old.length - p.at; p.at = 0; }
        };
      }
      process(inputs, outputs) {
        const left = outputs[0][0], right = outputs[0][1];
        for (const p of this.phones.values()) {
          if (!p.playing) { if (p.size < 3840) continue; p.playing = true; }   // starts with 40 ms in hand
          for (let n = 0; n < left.length; n++) {
            if (!p.chunks.length) { p.playing = false; break; }               // ran dry: waits for 40 ms again
            const c = p.chunks[0];
            left[n] += c[p.at] / 32768;
            right[n] += c[p.at + 1] / 32768;
            p.at += 2;
            p.size -= 2;
            if (p.at >= c.length) { p.chunks.shift(); p.at = 0; }
          }
        }
        for (let n = 0; n < left.length; n++) {
          left[n] = Math.max(-1, Math.min(1, left[n]));
          right[n] = Math.max(-1, Math.min(1, right[n]));
        }
        return true;
      }
    }
    registerProcessor('mix', Mix);`;

  async function startSound() {
    audioStarting = true;
    try {
      audio = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
      await audio.audioWorklet.addModule(URL.createObjectURL(new Blob([MIXER], { type: 'application/javascript' })));
      mixer = new AudioWorkletNode(audio, 'mix', { numberOfInputs: 0, outputChannelCount: [2] });
      mixer.connect(audio.destination);
      if (audio.state !== 'running') await audio.resume();
    } catch (e) {
      say('stats {"sound":"' + String(e.message || e).replace(/"/g, "'") + '"}');
    }
  }

  function sound(slot, b) {
    if (!mixer) { if (!audioStarting) startSound(); return; }
    const pcm = new Int16Array(b.slice(2).buffer);   // its own copy, aligned
    mixer.port.postMessage({ slot, pcm }, [pcm.buffer]);
  }

  // ---------------------------------------------------------------- how it's going (the log, and the self-test)

  setInterval(() => {
    if (!slots.size) return;
    const phones = [...slots.values()].map(s => ({ slot: s.slot, decoded: s.decoded, codec: s.codec, size: s.canvas.width + 'x' + s.canvas.height }));
    say('stats ' + JSON.stringify({ phones, sound: audio ? audio.state : 'none', latency: audio ? Math.round((audio.baseLatency + (audio.outputLatency || 0)) * 1000) : 0 }));
  }, 1000);

  connect();
</script>
</body>
</html>
