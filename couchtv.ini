; ======================================================================
;  CouchTV settings
;
;  Edit in Notepad, save, then press F5 on the TV home screen to reload.
;  Lines starting with ; are comments.
; ======================================================================

[CouchTV]
; Keys that jump back to the home screen from any app (comma separated).
;   BrowserHome      = the house button on most remotes and mini keyboards
;   Win              = a tap of the Windows key (TV mode only)
;   Hold:BrowserBack = hold Back for a moment, for remotes whose one
;                      Home/Back button only sends Back (e.g. G10S)
;   Also allowed: F1..F12, Escape, Hold:Escape, Ctrl+Alt+H style combinations.
HomeKeys = BrowserHome, Win, Hold:BrowserBack, Ctrl+Alt+H

; Optional picture behind the home screen, e.g. C:\Users\Public\Pictures\wall.jpg
Wallpaper =

; The CouchIR remote receiver is found automatically. Only set this if it
; isn't, e.g. RemotePort = COM5
RemotePort =

; Updates: CouchTV checks this GitHub repository's branch every 10 minutes and
; offers to install new commits (Settings & power > Update, or F6 to check now).
Updates = on
UpdateRepo = charan-mudiraj/CouchTV
UpdateBranch = main

; Leave blank to auto-detect. Set full paths only if a browser lives somewhere unusual.
BravePath =
EdgePath =

; ----------------------------------------------------------------------
;  Tiles: each [Section] below is one tile, shown in this order.
;
;  Row      apps (default) | system
;  Type     web      open Url full-screen, with no tabs or address bar
;           browser  a normal browser window (Url optional)
;           app      run Exe with Args
;           uri      open a link such as ms-settings:bluetooth
;           action   built in: sleep | sleeptimer | restart | shutdown | desktop
;  Browser  brave  - Shields block ads; use it for free, ad-supported sites
;           edge   - Netflix's best-supported Windows browser (up to 4K);
;                    paid services have no ads to block anyway
;  Profile  tv (default: CouchTV's own browser profile) | default (your
;           normal browser profile) | any other name for a separate one
;  Scale    make a site's text bigger, e.g. 1.25
;  Search   the site's search address with {q} where the words go, e.g.
;           Search = https://example.com/search?q={q}   (or off to leave the
;           tile out of search). Netflix, YouTube, Prime Video, JioHotstar,
;           Spotify and Web (Google) search without it.
;  Enabled  false hides a tile without deleting it
;  Look     Text, Glyph (Segoe icon code), Background, Background2 (gradient),
;           Foreground, Weight, or Image = icons\name.png for your own artwork
; ----------------------------------------------------------------------

[Netflix]
Type = web
Url = https://www.netflix.com/browse
Browser = edge
Text = NETFLIX
Weight = Black
Background = #000000
Background2 = #1F0306
Foreground = #E50914
Hint = Opens in Edge for the best picture

[YouTube]
Type = web
Url = https://www.youtube.com
Browser = brave
; Your normal Brave profile: you're already signed in, and Shields block the ads.
Profile = default
Text = YouTube
Glyph = E768
Weight = Black
Background = #FF1A1A
Background2 = #B00010
Foreground = #FFFFFF
Hint = Opens in Brave, ads blocked

[Prime Video]
Type = web
Url = https://www.primevideo.com
Browser = edge
Text = prime video
Background = #00A8E1
Background2 = #0B5D9C
Foreground = #FFFFFF
Hint = Opens in Edge for the best picture

[JioHotstar]
Type = web
Url = https://www.hotstar.com/in
Browser = edge
Text = JioHotstar
Background = #1C2B7A
Background2 = #0A0F2E
Foreground = #FFFFFF
Hint = Opens in Edge for the best picture

[Web]
Type = browser
Browser = brave
Profile = default
Glyph = E774
Text = Web
Background = #FB542B
Background2 = #C2280C
Foreground = #FFFFFF
Hint = Your normal Brave browser, with your bookmarks

; ----- Optional tiles: change Enabled to true to show them -----

[SonyLIV]
Enabled = false
Type = web
Url = https://www.sonyliv.com
Browser = edge
Background = #111111
Foreground = #FFFFFF

[ZEE5]
Enabled = false
Type = web
Url = https://www.zee5.com
Browser = edge
Background = #8230C6
Background2 = #4B1580
Foreground = #FFFFFF

[Spotify]
Enabled = false
Type = web
Url = https://open.spotify.com
Browser = brave
Glyph = E8D6
Background = #1DB954
Background2 = #127A37
Foreground = #000000

; YouTube's TV interface: made for the remote (arrows and OK, no pointing),
; but Brave's built-in blocker misses its ads, so expect a few. It's ideal with
; YouTube Premium Lite. Needs Brave: Edge ignores the TV user agent on YouTube.
; If Google stops accepting this user agent, try:
;   Mozilla/5.0 (SMART-TV; Linux; Tizen 6.5) AppleWebKit/537.36 (KHTML, like Gecko) SamsungBrowser/3.0 TV Safari/537.36
[YouTube for TV]
Enabled = false
Type = web
Url = https://www.youtube.com/tv
UserAgent = Mozilla/5.0 (PS4; Leanback Shell) Cobalt/25.lts.40.1035033; compatible; X
Browser = brave
Profile = youtube-tv
Text = YouTube
Glyph = E7F4
Weight = Black
Background = #282828
Background2 = #0F0F0F
Foreground = #FFFFFF
Hint = YouTube's TV version, made for the remote

; These appear by themselves once the program is installed.
[Kodi]
Type = app
Exe = %ProgramFiles%\Kodi\kodi.exe
HideIfMissing = true
Background = #17B2E7
Background2 = #0C5E7C
Foreground = #FFFFFF
Hint = Your own videos and music

[VLC]
Type = app
Exe = %ProgramFiles%\VideoLAN\VLC\vlc.exe
Args = --fullscreen
HideIfMissing = true
Glyph = E714
Background = #FF8800
Background2 = #B85400
Foreground = #FFFFFF
Hint = Play files from a USB drive

; ----- Settings & power row -----
; Bluetooth and Sound use classic Windows tools that work in TV mode.
; Windows' Settings app (ms-settings: links) only runs while the desktop is
; running, so Display and Network start the Windows desktop first if needed.

[Bluetooth]
Row = system
Type = app
Exe = %SystemRoot%\System32\DevicePairingWizard.exe
Glyph = E702

[Sound]
Row = system
Type = app
Exe = %SystemRoot%\System32\rundll32.exe
Args = shell32.dll,Control_RunDLL mmsys.cpl,,0
Glyph = E767

[Display]
Row = system
Type = uri
Url = ms-settings:display
Glyph = E7F4

[Network]
Row = system
Type = uri
Url = ms-settings:network-status
Glyph = E839

; Set up an infrared remote with the CouchIR receiver (see ir-receiver\README.md).
[Remote]
Row = system
Type = action
Action = remote
Glyph = E8EA

[Sleep timer]
Row = system
Type = action
Action = sleeptimer
Glyph = E916

[Sleep]
Row = system
Type = action
Action = sleep
Glyph = E708

[Restart]
Row = system
Type = action
Action = restart
Glyph = E72C

[Turn off]
Row = system
Type = action
Action = shutdown
Glyph = E7E8

[Windows desktop]
Row = system
Type = action
Action = desktop
Glyph = E770
